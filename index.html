<!DOCTYPE html>
<html>
<head>
    <title>DART sensor</title>
    <meta content='width=device-width, initial-scale=1' name='viewport'/>

    <style>
        /* show the table and graph side by side */
        #analysis_layout {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        /* allow scrolling incase it goes off the screen */
        #analysis_table_section {
            overflow-x: auto;
        }

        /* the siz of the graph */
        #delay_chart_section {
            position: relative;
            min-width: 0;
            height: 450px;
        }

        /* change the table and graph to be ontop of eachother for smaller screens and change their size */
        @media (max-width: 900px) {
            #analysis_layout {
                grid-template-columns: 1fr;
            }
        
            #delay_chart_section {
                height: 350px;
            }
        }
    </style>
</head>
<body>
    <!-- the page to login to the main page through google -->
    <div id="login_with_Google" hidden>
        <h1>DART Sensor Login</h1>
        <button id="login_button">Sign in using Google</button>
        <p id="the_login_error"></p>
    </div>
    <!-- the main actually collecting the dart data page -->
    <div id="on_main_page" hidden>
        <!-- the actual HTML body to set up the webpage -->
        <h1>Collect data page</h1>
        <label for="train_select">Which of the following trains are you on</label>
        <select id="train_select">
            <option value="">Choose one of the following</option>
        </select>
        <button id="start_button">Start Recording</button>
        <button id="stop_button">Stop Recording</button>
        <div id="is_running" style="width:20px; height:20px; background-color:red;"></div>
        <p id="the_gps_values"></p>
        <!-- analysis of the readings part of the webpage  -->
        <h2>Analyse a saved journey</h2>
        <!-- asks the user to select a journey using a dropdown  -->
        <label for="journey_select">Choose a journey:</label>
        <select id="journey_select">
            <option value="">Choose a saved journey</option>
        </select>
        <!-- gets the last saved journey from firebase and calls the analysis cloud python function -->
        <button id="refresh_journeys_button" type="button">Refresh journeys</button>
        <button id="analyse_button" type="button">Analyse Journey</button>
        <!-- message to show the user the status of the analysis -->
        <p id="analysis_message"></p>
        
        <!-- class for the analysis table and graph -->
        <div id="analysis_layout">  
            <!-- table part -->
            <div id="analysis_table_section">
                <table id="analysis_table" hidden>
                    <thead>
                        <tr>
                            <th>Station</th>
                            <th>Scheduled arrival</th>
                            <th>GPS estimated arrival</th>
                            <th>Arrival status</th>
                        </tr>
                    </thead>
                    <tbody id="analysis_results_body"></tbody>
                </table>
            </div>
        
            <!-- graph part -->
            <div id="delay_chart_section" hidden>
                <canvas id="delay_chart_area"></canvas>
            </div>
        
        </div>

    </div>
    <!-- the firebase imports -->
    <script src="https://www.gstatic.com/firebasejs/13.1.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/13.1.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/13.1.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/13.1.0/firebase-functions-compat.js"></script>
    <!-- the setup for firebase -->
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyByfgA9ojBhvFVSG87JNPYQDmIx-7yVaxw",
            authDomain: "urban-computing-6314b.firebaseapp.com",
            projectId: "urban-computing-6314b",
            storageBucket: "urban-computing-6314b.firebasestorage.app",
            messagingSenderId: "385401917960",
            appId: "1:385401917960:web:ba91f8642ae29d0a5ff7bd",
            measurementId: "G-E3WD68Q388"
    };
    firebase.initializeApp(firebaseConfig);
    </script>

    <!-- import the graphs library for javascript -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <script src="firebase.js"></script>
    <script src="sensor.js"></script>
</body>
</html>
